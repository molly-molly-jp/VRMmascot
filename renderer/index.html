<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>VRM Mascot</title>
  <script type="importmap">
  {
    "imports": {
      "three": "../node_modules/three/build/three.module.js",
      "three/addons/": "../node_modules/three/examples/jsm/",
      "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
      "@pixiv/three-vrm-animation": "../node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    canvas {
      display: block;
      cursor: grab;
      user-select: none;
    }
    canvas.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas id="vrm-canvas" draggable="false"></canvas>
  <script type="module" src="./index.js"></script>

  <script>
    const api    = window.electronAPI;
    const canvas = document.getElementById('vrm-canvas');
    let dragging = false;

    // ── Phase 11: カメラオービット用ドラッグ変数 ─────────────────
    let camDragging  = false;
    let camLastX     = 0;
    let camLastY     = 0;
    // Phase 11: 中クリックパン用変数
    let panDragging  = false;
    let panLastX     = 0;
    let panLastY     = 0;
    const CAM_SENSITIVITY = 0.005; // px → ラジアン変換係数
    const ZOOM_SENSITIVITY = 0.003; // wheelDeltaY → distance 変換係数

    // ── ヒットテスト用ユーティリティ ────────────────────────
    function isOpaqueAt(x, y) {
      const fn = window._getAlphaAtPixel;
      if (typeof fn !== 'function') return false;
      return fn(x, y) >= 10; // 10以上を「モデルあり」とみなす
    }

    // ── ignore状態の管理 ─────────────────────────────────────
    // 状態を一元管理して無駄なIPC送信を防ぐ
    let currentIgnore = null;
    function setIgnore(ignore) {
      if (ignore === currentIgnore) return;
      currentIgnore = ignore;
      api.setIgnoreMouseEvents(ignore);
    }

    // 起動時: 全面クリックスルー（forward:trueはmain.js側で設定済み）
    setIgnore(true);

    // ── mousemove: ヒットテストでignoreを切り替える ──────────
    //
    // ポイント: setIgnoreMouseEvents(true, {forward:true}) の状態でも
    // mousemove だけは届くので、透明/不透明を毎フレーム判定できる。
    //
    // ドラッグ中は dragMove() だけ呼ぶ。
    // setIgnoreMouseEvents は触らない（拡大バグを防ぐため）。
    window.addEventListener('mousemove', (e) => {
      // Phase 11: カメラドラッグ中は orbit を更新して終了
      if (camDragging) {
        const dx = e.clientX - camLastX;
        const dy = e.clientY - camLastY;
        camLastX = e.clientX;
        camLastY = e.clientY;
        const fn = window._updateCameraOrbit;
        if (typeof fn === 'function') fn(dy * CAM_SENSITIVITY, -dx * CAM_SENSITIVITY);
        return;
      }
      // Phase 11: 中クリックパン中は注視点を上下左右に移動
      if (panDragging) {
        const dx = e.clientX - panLastX;
        const dy = e.clientY - panLastY;
        panLastX = e.clientX;
        panLastY = e.clientY;
        const fn = window._updateCameraTarget;
        if (typeof fn === 'function') fn(dx, dy);
        return;
      }
      if (dragging) {
        api.dragMove();
        return;
      }
      setIgnore(!isOpaqueAt(e.clientX, e.clientY));
    });

    // ── mousedown: モデルを掴む ──────────────────────────────
    document.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        // Phase 11: 右クリック → カメラドラッグ開始
        camDragging = true;
        camLastX    = e.clientX;
        camLastY    = e.clientY;
        setIgnore(false);
        e.preventDefault();
        return;
      }
      if (e.button === 1) {
        // Phase 11: 中クリック → 注視点パン開始
        panDragging = true;
        panLastX    = e.clientX;
        panLastY    = e.clientY;
        setIgnore(false);
        e.preventDefault();
        return;
      }
      if (e.button !== 0) return;
      dragging = true;
      canvas.classList.add('dragging');
      // ドラッグ中は確実にイベントを受け取る
      setIgnore(false);
      api.dragStart();
      e.preventDefault();
    });

    // ── mouseup: ドラッグ終了 → ignore を透明状態に戻す ─────
    //
    // ここが重要:
    // mouseup 後に ignore=true を明示的に設定し直す。
    // こうしないと「透明領域の上で drag=false」のまま ignore=false が残り、
    // 後ろのウィンドウを操作できなくなる。
    // 次の mousemove でヒットテストが走り、モデルの上なら false に戻る。
    window.addEventListener('mouseup', (e) => {
      if (e.button === 2 && camDragging) {
        // Phase 11: 右クリックドラッグ終了
        camDragging = false;
        currentIgnore = null;
        api.setIgnoreMouseEvents(true);
        return;
      }
      if (e.button === 1 && panDragging) {
        // Phase 11: 中クリックパン終了
        panDragging = false;
        currentIgnore = null;
        api.setIgnoreMouseEvents(true);
        return;
      }
      if (e.button !== 0 || !dragging) return;
      dragging = false;
      canvas.classList.remove('dragging');
      api.dragEnd();
      // ignore をリセット: 次の mousemove でヒットテストが再評価する
      currentIgnore = null;
      api.setIgnoreMouseEvents(true);
    });

    canvas.addEventListener('dragstart', (e) => e.preventDefault());
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop',     (e) => e.preventDefault());

    // ── Phase 11: Ctrl+ホイール → カメラズーム ───────────────
    window.addEventListener('wheel', (e) => {
      if (!e.shiftKey) return;
      e.preventDefault();
      const fn = window._updateCameraZoom;
      if (typeof fn === 'function') fn(e.deltaY * ZOOM_SENSITIVITY);
    }, { passive: false });

    window.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') api.closeWindow();
    });
  </script>
</body>
</html>
