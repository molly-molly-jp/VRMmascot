<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>VRM Mascot</title>
  <script type="importmap">
  {
    "imports": {
      "three": "../node_modules/three/build/three.module.js",
      "three/addons/": "../node_modules/three/examples/jsm/",
      "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; cursor: grab; user-select: none; }
    canvas.dragging { cursor: grabbing; }
    #input-area {
      position: fixed;
      display: flex; gap: 4px; padding: 6px;
      background: rgba(0,0,0,0.5);
    }
    #text-input {
      flex: 1; padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 6px;
      background: rgba(255,255,255,0.12); color: #fff;
      font-size: 13px; outline: none; resize: none;
      height: 32px; line-height: 20px; overflow: hidden; font-family: inherit;
    }
    #text-input:focus { border-color: rgba(255,255,255,0.7); }
    #send-btn {
      padding: 6px 14px; border: none; border-radius: 6px;
      background: rgba(100,160,255,0.85); color: #fff;
      font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    #send-btn:disabled, #text-input:disabled { opacity: 0.5; }
    #status {
      position: fixed;
      width: 100%; text-align: center; font-size: 13px;
      color: rgba(255,255,255,0.9); pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>
  <canvas id="vrm-canvas" draggable="false"></canvas>
  <div id="status">モデルを読み込んでいます...</div>
  <div id="input-area">
    <textarea id="text-input" placeholder="テキストを入力してEnter..." rows="1"></textarea>
    <button id="send-btn" type="button">送信</button>
  </div>

  <script type="module" src="./index.js"></script>

  <script>
    const api    = window.electronAPI;
    const canvas = document.getElementById('vrm-canvas');
    let dragging = false;

    function fixUILayout() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      const inputArea = document.getElementById('input-area');
      inputArea.style.left  = '0px';
      inputArea.style.top   = (H - 44) + 'px';
      inputArea.style.width = W + 'px';
      document.getElementById('status').style.cssText =
        `top:${Math.floor(H/2)}px; left:0px;`;
    }
    fixUILayout();

    canvas.addEventListener('dragstart', (e) => e.preventDefault());
    document.addEventListener('dragover',  (e) => e.preventDefault());
    document.addEventListener('drop',      (e) => e.preventDefault());

    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      dragging = true; canvas.classList.add('dragging');
      api.dragStart(); e.preventDefault();
    });
    window.addEventListener('mousemove', () => { if (dragging) api.dragMove(); });
    window.addEventListener('mouseup', (e) => {
      if (e.button !== 0 || !dragging) return;
      dragging = false; canvas.classList.remove('dragging'); api.dragEnd();
    });
    document.getElementById('text-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault(); e.stopPropagation();
        if (typeof window._sendText === 'function') window._sendText();
      }
    });
    document.getElementById('send-btn').addEventListener('click', () => {
      if (typeof window._sendText === 'function') window._sendText();
    });
    window.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') api.closeWindow();
    });
  </script>
</body>
</html>
