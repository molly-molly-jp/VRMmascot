<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>VRM Mascot</title>
  <script type="importmap">
  {
    "imports": {
      "three": "../node_modules/three/build/three.module.js",
      "three/addons/": "../node_modules/three/examples/jsm/",
      "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    #hint {
      position: fixed; bottom: 6px; left: 0; width: 100%;
      text-align: center; font-size: 11px;
      color: rgba(255,255,255,0.55); pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #status {
      position: fixed; top: 50%; left: 0; width: 100%;
      text-align: center; font-size: 13px;
      color: rgba(255,255,255,0.9); pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>
  <canvas id="vrm-canvas"></canvas>
  <div id="status">モデルを読み込んでいます...</div>
  <div id="hint">左クリックドラッグ: 移動 ／ Esc: 閉じる</div>

  <script type="module" src="./index.js"></script>

  <script>
    const api    = window.electronAPI;
    const canvas = document.getElementById('vrm-canvas');
    let dragging = false;

    // 左クリックドラッグでウィンドウ移動
    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      dragging = true;
      canvas.classList.add('dragging');
      api.dragStart();
      e.preventDefault();
    });

    window.addEventListener('mousemove', () => {
      if (dragging) api.dragMove();
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button !== 0 || !dragging) return;
      dragging = false;
      canvas.classList.remove('dragging');
      api.dragEnd();
    });

    // 右クリックメニューを無効化
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    // Escで閉じる
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') api.closeWindow();
    });
  </script>
</body>
</html>
